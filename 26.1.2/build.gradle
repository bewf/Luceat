plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = providers.fileContents(layout.projectDirectory.file("../version.properties")).asText.map { text ->
	def props = new Properties()
	props.load(new StringReader(text))
	props.getProperty("mod_version").trim()
}.get()

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Polyfrost'
				url = 'https://repo.polyfrost.org/releases'
			}
		}
		filter {
			includeGroup 'org.polyfrost.oneconfig'
		}
	}
}

base {
	archivesName = "luceat-mc${project.minecraft_version}"
}

sourceSets {
	testmod
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"luceat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}

		"luceat-testmod" {
			sourceSet sourceSets.testmod
		}
	}

	runs {
		exporter {
			inherit client
			displayName = "Luceat Item Exporter"
			sourceSet = sourceSets.testmod.name
			generateRunConfig = true
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	clientImplementation "maven.modrinth:sodium:${project.sodium_version}"
	clientCompileOnly "org.polyfrost.oneconfig:mod-toggles:${project.oneconfig_toggles_version}"
	clientCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

tasks.withType(ProcessResources).configureEach {
	def modVersion = project.version.toString()
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("../LICENSE.md") {
		rename { "LICENSE_${projectName}.md" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Configure a publishing repository here if needed.
	}
}

/*
 * Separate source set for development-only item exporting.
 * This source set is not included in the normal Luceat mod JAR.
 */
sourceSets {
	testmod {
		java.setSrcDirs(["src/testmod/java"])
		resources.setSrcDirs(["src/testmod/resources"])

		compileClasspath += sourceSets.client.compileClasspath
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.client.output

		runtimeClasspath += sourceSets.client.runtimeClasspath
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.client.output
	}
}

configurations {
	testmodImplementation.extendsFrom implementation, clientImplementation
	testmodRuntimeOnly.extendsFrom runtimeOnly, clientRuntimeOnly
}

